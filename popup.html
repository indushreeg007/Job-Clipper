<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body class="popup">
<header class="phead">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
  <div><b>Job Clipper</b><small>Clip it. Track it. Never lose an opportunity.</small></div></div>
</header>
<div class="page"><small>Current page</small><div id="page">…</div></div>
<p id="hint" class="hint" hidden></p>
<div id="msg" class="msg" hidden></div>
<div class="pgrid">
  <label class="wide">Job title<input id="title"></label>
  <label class="wide">Company<input id="company"></label>
  <label class="wide">Application URL<input id="url"></label>
  <label>Deadline<input id="deadline" type="date"></label>
  <label>Job type<input id="type" list="types" placeholder="e.g. Internship"></label>
  <label>Location<input id="location"></label>
  <label>Salary / Stipend<input id="salary"></label>
  <label class="wide">Source website<input id="source"></label>
  <details class="wide"><summary>Description</summary><textarea id="description" rows="4"></textarea></details>
</div>
<datalist id="types"><option>Internship<option>Full-time<option>Part-time<option>Contract<option>Freelance<option>Remote</datalist>
<footer class="pfoot"><button id="save" class="btn pri big">Save job</button><button id="dash" class="btn big">Open tracker</button></footer>
<script src="common.js"></script><script src="popup.js"></script>
</body></html>

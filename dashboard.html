<!doctype html>
<html><head><meta charset="utf-8"><title>Job Clipper – Tracker</title><link rel="stylesheet" href="style.css"></head>
<body class="dash">
<header class="top">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
  <div><b>Job Clipper</b><small>Clip it. Track it. Never lose an opportunity.</small></div></div>
  <nav class="tabs"><button data-v="board" class="on">Board</button><button data-v="reminders">Reminders <span id="remBadge" class="badge" hidden></span></button></nav>
  <div class="actions"><button id="add" class="btn pri">Add job</button><button id="csv" class="btn">Export CSV</button><button id="set" class="btn">Settings</button></div>
</header>
<section id="stats" class="stats"></section>
<section id="bar" class="bar">
  <input name="q" type="search" placeholder="Search company, title, website or status" class="grow">
  <select name="status"><option value="">All statuses</option></select>
  <select name="type"></select><select name="location"></select><select name="source"></select>
  <select name="dl"><option value="">Any deadline</option><option value="overdue">Overdue</option><option value="soon">Within 3 days</option><option value="week">Within 7 days</option><option value="has">Has deadline</option><option value="none">No deadline</option></select>
  <select name="sort"><option value="saved">Recently saved</option><option value="deadline">Deadline</option><option value="company">Company name</option><option value="title">Job title</option></select>
</section>
<main id="main"></main>
<datalist id="types"><option>Internship<option>Full-time<option>Part-time<option>Contract<option>Freelance<option>Remote</datalist>
<dialog id="dlg"></dialog><dialog id="setDlg"></dialog>
<script src="common.js"></script><script src="dashboard.js"></script>
</body></html>
